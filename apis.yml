  endpointsModeled: true
  accessModel: Partner-gated - no self-serve public API documented
  properties:
  - url: https://helpcenter.superbexperience.com/en/article/how-to-use-booking-statuses-ne8q0n/
    type: Documentation
  description: >-
    Logical capability for the booking lifecycle - confirmations, reminders,
    booking statuses, no-show handling and prepayment or deposit flows. Managed
    inside the Superb apps and communicated to guests over email and SMS; no
    endpoint-level public API is documented, so endpoints are modeled.
