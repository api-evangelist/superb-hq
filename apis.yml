  humanURL: https://www.superbexperience.com/
  endpointsModeled: true
  accessModel: Partner-gated - no self-serve public API documented
  properties:
  - url: https://www.superbexperience.com/
    type: Documentation
  description: >-
    Logical capability for guest CRM and email marketing - segments, campaigns
    and automated messaging built on the guest database. Delivered as an
    in-product feature and via pre-built marketing connectors (Meta Pixel,
    Google Ads, Google Tag Manager); no public REST API is documented, so
    endpoints are modeled.
