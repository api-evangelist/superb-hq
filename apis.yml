  endpointsModeled: true
  accessModel: Partner-gated - no self-serve public API documented
  properties:
  - url: https://www.superbexperience.com/
    type: Documentation
  description: >-
    Logical capability for guest profiles and the guest database - contact
    details, visit history, notes, tags, spend and preferences that power
    Superb's Guest Experience Management. Exposed through the Superb product
