aid: superb-hq
url: https://raw.githubusercontent.com/api-evangelist/superb-hq/refs/heads/main/apis.yml
name: Superb
kind: company
description: >-
  Superb is a Denmark-based all-in-one Guest Experience Management (GXM) platform
  for restaurants, cafes and bars, bringing reservations, point of sale, payments,
  gift cards, online takeaway, guest CRM and marketing together in a single system.
  Superb does not publish a self-serve, documented public developer API. Guest
  bookings are taken through a hosted reservation widget, and third-party systems
  connect through Superb's catalog of pre-built connectors (accounting, payments,
  staff and stock management, marketing) plus a partner portal at
  partner.superbexperience.com. Any programmatic reservation, guest, booking or
  CRM access is partner-gated and arranged directly with Superb. The APIs listed
  below are logical capability groupings modeled from Superb's public product and
  help-center material - they are marked endpointsModeled because Superb does not
  publish endpoint-level REST documentation.
